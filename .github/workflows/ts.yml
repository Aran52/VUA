# W11 (M3 closure) — TypeScript / desktop verification chain.
#
# Scope: the root `pnpm check` chain exactly as run locally per merge:
# typecheck, vitest, production build, boundary/i18n/contrast/leak checks.
# The desktop build compiles the host and optional AMF binaries, so the
# Rust toolchain is installed here
# too. Fixture payloads must never leak into the production bundle — the
# check:leak fingerprint scan is part of this chain and its failure fails
# the badge.
name: ts

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/recipe-links/**"
      - "schemas/amf-recipe/**"
      - "schemas/selection-share/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/provider-host/**"
      - "crates/amf-provider/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ts.yml"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  share-links:
    name: Share-link service (offline tests and typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Share-link contract, storage and material-page tests
        run: pnpm --filter @vua/recipe-links test
      - name: Share-link TypeScript boundary
        run: pnpm --filter @vua/recipe-links typecheck
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm check (typecheck + test + build + boundary + i18n + contrast + leak)
        run: pnpm check
      - name: Library maintenance interaction (isolated profile, synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:library-maintenance
      - name: Local material entry and saved source display (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:material-entry
      - name: Bundle Main and preload for module interaction
        run: node apps/desktop/scripts/build-electron.mjs
      - name: Tray updates and exit (isolated process)
        run: pnpm --filter @vua/desktop smoke:system-tray
      - name: First-run UI and scenario receipt continuity (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:first-run-ui
      - name: Independent component and pair update controls (synthetic ports)
        run: pnpm --filter @vua/desktop smoke:component-updates
      - name: AMF module imports, failed replacement and generation cleanup (synthetic code)
        run: pnpm --filter @vua/desktop smoke:amf-generations
      - name: AMF activation and isolation (isolated profile, native providers)
        run: pnpm --filter @vua/desktop smoke:amf-module
      - name: Help, knowledge and compact Play navigation (isolated profile)
        run: pnpm --filter @vua/desktop smoke:help-navigation
      - name: Wiki and AMF browser within shell navigation (isolated profile, synthetic websites)
        run: pnpm --filter @vua/desktop smoke:asset-browser
      - name: Notifications above browsing and AMF shape ownership (isolated profile, synthetic ports)
        run: pnpm --filter @vua/desktop smoke:browser-shell
      - name: Stable sidebar and page/card widths across detail scrolling (synthetic ports)
        run: pnpm --filter @vua/desktop smoke:layout-stability
      - name: MCP clearing, tool loading and Play alignment in all themes (synthetic ports)
        run: pnpm --filter @vua/desktop smoke:mcp-theme-ui
      - name: Regional reference and website tests (four languages, synthetic observations)
        run: pnpm --filter @vua/desktop smoke:network
      - name: Native splash, first-use language and optional tour (isolated profile)
        run: pnpm --filter @vua/desktop smoke:startup
      - name: Unsupported system language fallback after a slow native handshake
        run: pnpm --filter @vua/desktop smoke:startup --locale-unmatched --slow-provider
      - name: Ordered Windows language preferences
        run: pnpm --filter @vua/desktop smoke:startup --locale-ordered
      - name: Resource summary and jurisdiction logo (isolated profile)
        run: pnpm --filter @vua/desktop smoke:resource-brand
      - name: VRCFT device selection and recovery (isolated profile, synthetic actions)
        run: pnpm --filter @vua/desktop smoke:vrcft
      - name: Recipes, dialogs and imports on the production pages (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:production-review
      - name: Materials to Recipe sharing in the Workshop (synthetic port)
        run: pnpm --filter @vua/desktop smoke:amf-production
      - name: External AI tool connection and approval (synthetic ports)
        run: pnpm --filter @vua/desktop smoke:ai-ui
      - name: Page switches stay quick while the AMF module is slow (synthetic delays)
        run: pnpm --filter @vua/desktop smoke:page-speed
      - name: A finished line whose project was removed (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:project-gone
      - name: Sidebar highlight and material details in history (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:shell-navigation
      - name: Bundled MCP implementation loads nothing from node_modules
        run: pnpm --filter @vua/desktop smoke:ai-bundle
      - name: MCP client through the real Gateway and host provider (read-only observations)
        run: pnpm --filter @vua/desktop smoke:ai-native
      - name: Materials filters, scrolling, list columns and link filter (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:library-navigation
      - name: Materials bulk actions (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:library-bulk
      - name: Materials file drop with Chromium's native drag store (isolated profile, native providers)
        run: pnpm --filter @vua/desktop smoke:library-drop
      - name: BOOTH sign-in session and sync (synthetic pages, native providers)
        run: pnpm --filter @vua/desktop smoke:booth-session
      - name: Dependency clues and local entries (synthetic Gateway)
        run: |
          pnpm --filter @vua/desktop smoke:dependency-clues
          pnpm --filter @vua/desktop smoke:library-entries
      - name: Import dialog (synthetic Gateway)
        run: pnpm --filter @vua/desktop smoke:import-dialog
      - name: Game guide window (no VRChat process)
        run: pnpm --filter @vua/desktop smoke:game-guide
      - name: Resource monitor popover (synthetic host)
        run: pnpm --filter @vua/desktop smoke:resource-monitor
      - name: Environment deployment checks (synthetic adapter facts)
        run: pnpm --filter @vua/desktop smoke:deployment
      - name: Remote content isolation (local HTTP fixtures)
        run: pnpm --filter @vua/desktop smoke:remote-content
