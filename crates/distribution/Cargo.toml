[package]
name = "vua-distribution"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Verified Windows installation, component delivery and native VUA launch."

[[bin]]
name = "vua-distribution"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
ed25519-dalek = "2.2.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4.3"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
semver = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "macros"] }
url = "2"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi"] }

[dev-dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
jsonschema = "0.52.1"
tempfile = "3"

[build-dependencies]
cc = "=1.4.4"
