# Preserve the portal's public response policy in each independent static location.
# Repeat HSTS as well: defining add_header here replaces inherited server headers.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
