# Include inside the existing HTTPS server, preserving all other locations.
# Exact/longer prefixes also win over a retired ^~ /api/ catch-all.
location = /api/shares {
    include /etc/nginx/snippets/recipe-links-proxy.conf;
}
location ^~ /api/shares/ {
    include /etc/nginx/snippets/recipe-links-proxy.conf;
}
location ~* ^/(r(/|$)|api/shares(/|$)) {
    include /etc/nginx/snippets/recipe-links-proxy.conf;
}
location @recipe_links_too_large {
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 413 '{"error":"too_large","message":"The request body exceeds 64 KiB."}';
}
