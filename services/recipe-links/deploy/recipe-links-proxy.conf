# Install as /etc/nginx/snippets/recipe-links-proxy.conf.
access_log off;
error_log /dev/null crit;
client_max_body_size 64k;
error_page 413 = @recipe_links_too_large;
proxy_pass http://127.0.0.1:6191;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Vua-Source-IP "";
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
expires off;
proxy_intercept_errors off;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;
proxy_send_timeout 20s;
# Own add_header directives replace inherited portal CSP headers on Ubuntu's Nginx.
# The service's upstream CSP remains authoritative for its hash-authorized stylesheet.
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=31536000" always;
