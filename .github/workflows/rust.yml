# W11 (M3 closure) — full Rust workspace verification.
#
# Scope: the same commands the local full-verification gate runs on every
# merge (cargo test --workspace, cargo clippy --all-targets). Real-machine
# Unity tests are marked #[ignore] and never run here; cloud CI uses
# structurally representative synthetic data only (AGENTS.md security
# boundaries). A green badge means the workspace logic is green, not that
# real-machine evidence exists.
name: rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "unity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-sdk-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and exercise the local SDK observer with synthetic Unity boundaries
        run: dotnet run --project unity/Tests/LocalTestBridge/LocalTestBridge.csproj
  test-and-clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo clippy --all-targets
        run: cargo clippy --all-targets -- -D warnings
