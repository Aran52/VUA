# Include only inside the existing ph-r.com HTTPS server block.
# Static hosting; no signing key, user data, application API or GitHub credentials.
location = /vua { return 308 /vua/downloads/; }
location = /vua/ { return 308 /vua/downloads/; }
location ^~ /vua/downloads/ {
    alias /var/www/vua/downloads/;
    autoindex off;
    include /etc/nginx/snippets/vua-site-security.conf;
    # Keep cache policy separate from the explicit complete security-header set.
    expires -1;
}
location ^~ /vua/releases/latest/ {
    alias /var/www/vua/releases/latest/;
    autoindex off;
    include /etc/nginx/snippets/vua-site-security.conf;
    gzip off;
    expires -1;
}
location ^~ /vua/releases/ {
    alias /var/www/vua/releases/;
    autoindex off;
    include /etc/nginx/snippets/vua-site-security.conf;
    gzip off;
    expires 1y;
}
